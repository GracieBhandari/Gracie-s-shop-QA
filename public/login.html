<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · Gracie's Shop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">Gracie's Shop</a>
      <nav class="main-nav" aria-label="Main">
        <a href="/">Home</a>
        <a href="/products.html">Shop</a>
      </nav>
      <form class="search-form" action="/products.html" role="search">
        <input type="search" name="search" placeholder="Search products" aria-label="Search products" data-testid="search-input">
        <button class="button" type="submit" data-testid="search-button">Search</button>
      </form>
      <div class="account-nav" id="account-nav" data-testid="account-nav"></div>
    </div>
  </header>

  <main class="container">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="auth-subtitle">Welcome back! Log in to your account.</p>

      <p class="form-error" id="form-error" role="alert" data-testid="form-error" hidden></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" data-testid="email-input">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" data-testid="password-input">
        </div>
        <button class="button button-full" type="submit" data-testid="login-button">Log in</button>
      </form>

      <p class="auth-switch">New to Gracie's Shop? <a id="switch-link" href="/register.html" data-testid="register-instead">Create an account</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Gracie's Shop · A QA portfolio project</div>
  </footer>
</body>
</html>
