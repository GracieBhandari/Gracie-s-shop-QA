<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracie's Shop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/home.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">Gracie's Shop</a>
      <nav class="main-nav" aria-label="Main">
        <a href="/" aria-current="page">Home</a>
        <a href="/products.html">Shop</a>
      </nav>
      <form class="search-form" action="/products.html" role="search">
        <input type="search" name="search" placeholder="Search products" aria-label="Search products" data-testid="search-input">
        <button class="button" type="submit" data-testid="search-button">Search</button>
      </form>
      <div class="account-nav" id="account-nav" data-testid="account-nav"></div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Little things that make home feel lovely</h1>
        <p>Thoughtfully chosen decor, kitchen goods, stationery, and accessories.</p>
        <a class="button button-large" href="/products.html" data-testid="shop-now">Shop all products</a>
      </div>
    </section>

    <section class="section container">
      <h2>Shop by category</h2>
      <div class="category-grid" id="categories" data-testid="category-list">
        <p class="message">Loading categories…</p>
      </div>
    </section>

    <section class="section container">
      <h2>Featured products</h2>
      <div class="product-grid" id="featured" data-testid="featured-products">
        <p class="message">Loading products…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Gracie's Shop · A QA portfolio project</div>
  </footer>
</body>
</html>
